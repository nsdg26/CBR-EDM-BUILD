<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vinyl record">
  <!-- The maskable variant, for Android, which crops an icon to whatever
       shape the launcher uses (circle, squircle, rounded square). Anything
       outside the centred circle of 80% diameter can be cut off, so the
       record is inset to about 72% and sits on a full bleed wall coloured
       field that fills whatever the mask keeps.

       Note for editors: see icon-source.svg on hyphens in XML comments. -->
  <defs>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="184"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#2b2a27"/>
  <circle cx="256" cy="256" r="184" fill="#141312" stroke="#bab8b0" stroke-width="18"/>
  <g clip-path="url(#disc)">
    <path d="M0 328 L328 0 L424 96 L96 424 Z" fill="#ffffff" opacity="0.08"/>
  </g>
  <g fill="none" stroke="#63615a" stroke-width="5.5">
    <circle cx="256" cy="256" r="159"/>
    <circle cx="256" cy="256" r="142"/>
    <circle cx="256" cy="256" r="125"/>
    <circle cx="256" cy="256" r="108"/>
    <circle cx="256" cy="256" r="91"/>
  </g>
  <circle cx="256" cy="256" r="62" fill="#d9d8d2"/>
  <circle cx="256" cy="256" r="17" fill="#b8722a"/>
</svg>
