<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vinyl record">
  <!-- Source art for the installed app icons. Same record as
       /favicon.svg, drawn with the detail a home screen can actually show:
       six grooves and fine strokes, where the favicon has two coarse ones
       because anything finer aliases into grey mush at 16px.

       Regenerate the PNGs beside this file from it whenever it changes.

       Note for editors: an XML comment may not contain two consecutive
       hyphens, so the repo's usual dash style is spelled with a colon or
       a comma in here. Two hyphens anywhere in this comment is a hard
       parse error and the browser renders nothing at all. -->
  <defs>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="244"/>
    </clipPath>
  </defs>
  <circle cx="256" cy="256" r="244" fill="#141312" stroke="#bab8b0" stroke-width="24"/>
  <g clip-path="url(#disc)">
    <path d="M-64 352 L352 -64 L480 64 L64 480 Z" fill="#ffffff" opacity="0.08"/>
  </g>
  <g fill="none" stroke="#63615a" stroke-width="7">
    <circle cx="256" cy="256" r="211"/>
    <circle cx="256" cy="256" r="189"/>
    <circle cx="256" cy="256" r="167"/>
    <circle cx="256" cy="256" r="145"/>
    <circle cx="256" cy="256" r="123"/>
    <circle cx="256" cy="256" r="101"/>
  </g>
  <circle cx="256" cy="256" r="82" fill="#d9d8d2"/>
  <circle cx="256" cy="256" r="22" fill="#b8722a"/>
</svg>
