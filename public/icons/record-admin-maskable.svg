<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vinyl record, red label">
  <!-- The admin panel's app icon: record-maskable.svg with a red label, in the
       site's stamp ink, so the installed admin app and the public site
       can be told apart on a home screen at a glance. A red label is a
       promo pressing, the copy that isn't for the public. The centre is a
       dark spindle hole rather than the sodium dot, which would vanish
       against the red.

       Source for the admin PNGs beside this file (icon-admin-*.png,
       apple-touch-icon-admin.png), which need regenerating whenever this
       changes. Note for editors: see record.svg on hyphens in XML
       comments. -->
  <defs>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="184"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#2b2a27"/>
  <circle cx="256" cy="256" r="184" fill="#141312" stroke="#bab8b0" stroke-width="18"/>
  <g clip-path="url(#disc)">
    <path d="M0 328 L328 0 L424 96 L96 424 Z" fill="#ffffff" opacity="0.08"/>
  </g>
  <g fill="none" stroke="#63615a" stroke-width="5.5">
    <circle cx="256" cy="256" r="159"/>
    <circle cx="256" cy="256" r="142"/>
    <circle cx="256" cy="256" r="125"/>
    <circle cx="256" cy="256" r="108"/>
    <circle cx="256" cy="256" r="91"/>
  </g>
  <circle cx="256" cy="256" r="62" fill="#8f1d1d"/>
  <circle cx="256" cy="256" r="17" fill="#141312"/>
</svg>
